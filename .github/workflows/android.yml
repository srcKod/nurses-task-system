name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build & publish a GitHub release for (e.g. v1.0.0)'
        required: false
        type: string

env:
  # Run JS actions (checkout, setup-java, upload-artifact) on Node 24 instead of
  # deprecated Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  # The release job publishes the APK to GitHub Releases via `gh release create`.
  contents: write

jobs:
  # ── CI: build + unit tests ────────────────────────────────
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is gitignored (BTL6) so the Firebase
      # config never enters git history. CI writes it from a repository secret
      # instead - the decoded file is the same one a developer keeps locally.
      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 secret is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

          # Fail here with a clear message instead of an opaque google-services
          # plugin error: the client package must match applicationId (M5).
          if ! grep -q '"package_name": "com.example.enursejobs"' app/google-services.json; then
            echo "::error::decoded google-services.json does not target com.example.enursejobs"
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ── Release: publish the CI-built APK to GitHub Releases ──────────────
  # Runs on v* tag pushes or workflow_dispatch with a release_tag input.
  # The APK comes from the build job's artifact - never from a developer
  # machine - so a release always matches a tagged commit.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')

    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag given - pass the release_tag input or push a v* tag."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release object already exists (e.g. a draft from a failed run) -
            # refresh title/notes so the object is complete, then attach the
            # CI-built APK.
            gh release edit "$TAG" \
              --title "$TAG — enurse educational snapshot" \
              --notes-file .github/release-notes.md
            gh release upload "$TAG" dist/app-release.apk --clobber
          else
            gh release create "$TAG" dist/app-release.apk \
              --title "$TAG — enurse educational snapshot" \
              --notes-file .github/release-notes.md
          fi
